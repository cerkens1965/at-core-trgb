; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_dir = /tmp/pio_build_atview

src_dir = examples/at_core_debug
; src_dir = examples/ws241_bringup   ; bring-up Waveshare 2.41 (build via env WS-216)
; ⤵ Bring-up Waveshare 2.16 : commenter la ligne ci-dessus + décommenter celle-ci,
;   puis  pio run -e WS-216 -t upload
; src_dir = examples/ws216_bringup
; src_dir = examples/ws216_blacktest    ; test minimal noir propre core3+GFX1.6.4
; src_dir = examples/lv_benchmark
; src_dir = examples/lv_music
; src_dir = examples/lv_images
; src_dir = examples/lv_gif
; src_dir = examples/lv_qrcode
; src_dir = examples/lv_slider
; src_dir = examples/lv_hellow
; src_dir = examples/TFT_eSPI_Sprite

; src_dir = examples/DeepSleep
; src_dir = examples/RGBPanel
; src_dir = examples/Touchpad
; src_dir = examples/BatteryVoltage
; src_dir = examples/AdjustBacklight

; src_dir = examples/Arduino_GFX_HelloWorld
; src_dir = examples/Arduino_GFX_SpriteGif

; lvgl 9 example , See README lvgl Upgrade Guide
; src_dir = examples/lvgl_version_9

;! Don't make changes
boards_dir = boards

[env:T-RGB]
lib_extra_dirs = ${PROJECT_DIR} 
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
upload_speed =  230400   ; baisse pour fiabiliser flash USB sur ESP32-S3 macOS
upload_port = /dev/cu.usbmodem*    ; glob : le n° change à la ré-énumération USB
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
    time
	default
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK

    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    ;-DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable -UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    -UARDUINO_USB_CDC_ON_BOOT

    
    -DCORE_DEBUG_LEVEL=0


lib_deps = 
    lvgl/lvgl @ 8.4.0
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
    moononournation/GFX Library for Arduino @ 1.5.0
    bblanchon/ArduinoJson@^7.0.0
    FS
    SPIFFS

debug_tool = esp-builtin
debug_speed = 500
platform_packages = tool-openocd


; ── Port test LilyGo T4-S3 AMOLED 2.41" (600×450) ────────────────────────────
; Quick & dirty : même firmware (BOARD_T4S3 active les shims dans le .ino).
; Utilise la lib LilyGo-AMOLED-Series (son LV_Helper + son lv_conf) — PAS le
; src/ T-RGB local (pas de lib_extra_dirs ici, sinon clash LV_Helper/lv_conf).
[env:T4-S3]
platform = espressif32@6.9.0
board = T-Display-AMOLED
framework = arduino
board_build.partitions = default_16MB.csv
upload_speed = 115200   ; T4-S3 : tout baud-switch échoue sur ce port USB-CDC → rester au baud initial
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
    time
	default
build_flags =
    -DBOARD_T4S3
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    bblanchon/ArduinoJson@^7.0.0
    FS
    SPIFFS
    SD


; ── 3ᵉ cible : Waveshare ESP32-S3-Touch-AMOLED-2.16 (480×480 CARRÉ) ───────────
; AMOLED CO5300 (QSPI) + touch CST9220 (CST92xx) — driver via Arduino_GFX, PAS
; le src/ T-RGB (ST7701) ni la lib LilyGo-AMOLED (RM690B0). Pile autonome.
; ESP32-S3R8 = 8 MB PSRAM OPI / 16 MB flash. Flag -DBOARD_WS216.
; Bring-up : décommenter `src_dir = examples/ws216_bringup` en haut, puis
;            pio run -e WS-216 -t upload
[env:WS-216]
; Pile Waveshare officielle : ESP32 Arduino core 3.x (pioarduino) + GFX 1.6.4.
; REQUIS pour le CO5300 : la 1.5.0/core2 rendait le noir verdâtre (driver CO5300
; pré-réécriture). Validé : noir profond avec cette pile (cf. ws216_blacktest).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8 : PSRAM octale (OPI)
board_upload.flash_size = 16MB
upload_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
    time
	default
build_flags =
    -DBOARD_WS216
    -DBOARD_HAS_PSRAM
    -DLV_CONF_PATH=lv_conf_ws216.h   ; lv_conf dédié (≠ src/ T-RGB, ≠ lib LilyGo T4)
    -Iinclude                        ; rend lv_conf_ws216.h visible à la lib lvgl (path relatif → pas d'espaces)
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1   ; logs série via USB-CDC natif
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lvgl/lvgl @ 8.4.0
    moononournation/GFX Library for Arduino @ 1.6.4   ; core 3.x : driver CO5300 réécrit (Arduino_OLED) → noir profond
    lewisxhe/SensorLib @ 0.4.1     ; >= driver TouchDrvCST92xx (CST9220)
    bblanchon/ArduinoJson@^7.0.0
    FS
    SD


; ── 4ᵉ cible : Waveshare ESP32-S3-Touch-AMOLED-2.41 (450×600 portrait → 600×450 PAYSAGE) ──
; AMOLED RM690B0 (QSPI) + touch FT6336 (FT6X36) — driver via Arduino_GFX (même pile que
; WS-216, PAS la lib LilyGo). -DBOARD_WS241 → le .ino #define BOARD_T4S3 (réutilise TOUT le
; layout T4 paysage) + PANEL_WS241 (override panneau/lvgl/touch par ws241_shim.h).
; ESP32-S3 N16R8 = 8 MB PSRAM OPI / 16 MB flash.
; Bring-up : décommenter `src_dir = examples/ws241_bringup` en haut, puis pio run -e WS-241 -t upload
[env:WS-241]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8 : PSRAM octale (OPI)
board_upload.flash_size = 16MB
upload_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
    time
	default
build_flags =
    -DBOARD_WS241
    -DBOARD_HAS_PSRAM
    -DLV_CONF_PATH=lv_conf_ws241.h   ; lv_conf dédié (copie de ws216 : pile Arduino_GFX)
    -Iinclude                        ; rend lv_conf_ws241.h visible à la lib lvgl (path relatif → pas d'espaces)
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1   ; logs série via USB-CDC natif
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lvgl/lvgl @ 8.4.0
    moononournation/GFX Library for Arduino @ 1.6.4   ; contient Arduino_RM690B0 (Arduino_OLED)
    lewisxhe/SensorLib @ 0.4.1     ; TouchDrvFT6X36
    bblanchon/ArduinoJson@^7.0.0
    FS
    SD


